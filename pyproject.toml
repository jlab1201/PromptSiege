[project]
name = "promptsiege"
version = "0.1.0"
description = "Prompt-injection scanner for LLM chatbots and SaaS widgets"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.52.0",
    "pydantic==2.13.4",
    "playwright==1.60.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "openai==2.38.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
